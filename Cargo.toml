[package]
name = "canopy"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
regex = "1.13.1"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
